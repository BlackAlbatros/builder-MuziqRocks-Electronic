apply plugin: 'com.android.application'

android {
    namespace "com.fireappbuilder.android.MuziqRocksEDM"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fireappbuilder.android.MuziqRocksEDM"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Prefer a local SDK jar if present (place engage-ads-sdk.jar or engage-ads-sdk-v1.1.0-alpha.jar in android/app/libs)
    if (file('libs/engage-ads-sdk.jar').exists()) {
        implementation files('libs/engage-ads-sdk.jar')
    } else if (file('libs/engage-ads-sdk-v1.1.0-alpha.jar').exists()) {
        implementation files('libs/engage-ads-sdk-v1.1.0-alpha.jar')
    } else {
        // Fallback to JitPack-built artifact
        implementation 'com.github.engage-media:engage-ads-sdk:v1.1.2-alpha'
    }
}

apply from: 'capacitor.build.gradle'

// Task: download engage-ads-sdk zip from provided CDN and extract jars/aar into android/app/libs
import java.util.zip.ZipInputStream

task downloadEngageSdk {
    doLast {
        def libsDir = file('libs')
        if (!libsDir.exists()) libsDir.mkdirs()
        // If a known jar already exists, skip download
        def existing = libsDir.listFiles().find { it.name == 'engage-ads-sdk.jar' || it.name == 'engage-ads-sdk-v1.1.0-alpha.jar' || it.name.endsWith('.aar') }
        if (existing) {
            println "Engage SDK already present in libs: ${existing.name}"
            return
        }
        def zipUrl = new URL('https://cdn.builder.io/o/assets%2F75422943980645d28df141712104f45a%2F8965cbf1547d4ee699c4621b965e8ad4?alt=media&token=40cab13b-257b-4bf0-b5b6-f1be64dde58b&apiKey=75422943980645d28df141712104f45a')
        println "Downloading Engage SDK from ${zipUrl}"
        def conn = zipUrl.openConnection()
        conn.setRequestProperty('User-Agent','Gradle')
        conn.connect()
        def zis = new ZipInputStream(conn.getInputStream())
        def entry = zis.getNextEntry()
        while (entry != null) {
            if (!entry.isDirectory()) {
                def name = new File(entry.getName()).getName()
                if (name.endsWith('.jar') || name.endsWith('.aar')) {
                    def out = new File(libsDir, name)
                    out.withOutputStream { os ->
                        byte[] buffer = new byte[8192]
                        int len
                        while ((len = zis.read(buffer)) > 0) {
                            os.write(buffer, 0, len)
                        }
                    }
                    println "Extracted ${name} to libs/"
                }
            }
            zis.closeEntry()
            entry = zis.getNextEntry()
        }
        zis.close()
    }
}

// Ensure SDK is downloaded before building the app
preBuild.dependsOn downloadEngageSdk

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
